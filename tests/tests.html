<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests — CampusBook</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/composants.css">
  <script type="module" src="reservations.test.js"></script>
</head>
<body>
  <main class="conteneur">
    <h1>Tests des règles métier</h1>
    <p class="sous-titre">Scénarios T1 à T13 du dossier de conception (D01). Le stockage est réinitialisé avant chaque test.</p>

    <!-- Résumé, ex. : « 13 / 13 tests réussis » -->
    <p id="resume-tests" class="alerte" aria-live="polite">Exécution des tests…</p>

    <table class="tableau">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Scénario</th>
          <th scope="col">Attendu</th>
          <th scope="col">Obtenu</th>
          <th scope="col">Résultat</th>
        </tr>
      </thead>
      <!-- Une ligne par scénario, ✅ ou ❌, générée par reservations.test.js -->
      <tbody id="resultats-tests"></tbody>
    </table>
  </main>
</body>
</html>
